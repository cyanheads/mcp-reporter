name: Feature Request
description: Suggest a new feature or improvement for mcp-reporter
labels: ["enhancement"]
assignees: ["cyanheads"]
body:
  - type: markdown
    attributes:
      value: |
        **Secondary labels.** `enhancement` is applied automatically — also add one or more of the following in the sidebar if they apply:
        - `performance` — improves memory, CPU, latency, or resource usage
        - `security` — hardens the security posture
        - `breaking-change` — will break the CLI or programmatic API
        - `surplus-token-idea` — worth exploring when token budget allows

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? Who benefits? Two or three sentences.
      placeholder: "Checking what changed between two server releases means diffing two reports by hand, and a changed schema is easy to miss..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The new behavior, config key, CLI flag, or report section. Include example config or output if it helps.
      placeholder: |
        A `--compare <previous-report.md>` flag that adds a section listing the tools, resources, and prompts added, removed, or changed since that report.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried or considered instead, and why it fell short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Only what the reader needs to act — related issues, prior art, a link.
    validations:
      required: false
